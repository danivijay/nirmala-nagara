<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#fff9c4"/>
  <!-- Road -->
  <rect x="0" y="200" width="400" height="100" fill="#9e9e9e"/>
  <rect x="0" y="195" width="400" height="10" fill="#757575"/>
  <!-- Wall -->
  <rect x="0" y="80" width="400" height="120" fill="#bcaaa4"/>
  <rect x="0" y="75" width="400" height="12" fill="#a1887f"/>
  <!-- Large waste pile -->
  <ellipse cx="200" cy="200" rx="90" ry="35" fill="#795548" opacity="0.8"/>
  <ellipse cx="180" cy="195" rx="45" ry="25" fill="#6d4c41" opacity="0.9"/>
  <!-- Garbage items -->
  <rect x="140" y="175" width="30" height="20" rx="4" fill="#ff9800" opacity="0.9"/>
  <rect x="175" y="170" width="25" height="30" rx="4" fill="#f44336" opacity="0.8"/>
  <ellipse cx="230" cy="185" rx="22" ry="15" fill="#9c27b0" opacity="0.7"/>
  <ellipse cx="155" cy="190" rx="18" ry="12" fill="#2196f3" opacity="0.7"/>
  <!-- Loose items -->
  <circle cx="260" cy="192" r="8" fill="#4caf50" opacity="0.8"/>
  <rect x="120" y="188" width="15" height="10" rx="2" fill="#ffeb3b"/>
  <!-- Label -->
  <rect x="10" y="10" width="210" height="36" rx="6" fill="#fff" opacity="0.85"/>
  <text x="20" y="32" font-family="system-ui,sans-serif" font-size="14" fill="#f57f17" font-weight="600">🗑 Sample: Mixed Waste Pile</text>
</svg>
