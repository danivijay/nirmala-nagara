<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#e8f5e9"/>
  <!-- Road -->
  <rect x="0" y="200" width="400" height="100" fill="#9e9e9e"/>
  <rect x="0" y="195" width="400" height="10" fill="#757575"/>
  <!-- Footpath -->
  <rect x="0" y="170" width="400" height="30" fill="#bdbdbd"/>
  <!-- Plastic bags cluster -->
  <ellipse cx="180" cy="185" rx="30" ry="15" fill="#ff9800" opacity="0.8"/>
  <ellipse cx="210" cy="188" rx="20" ry="12" fill="#f44336" opacity="0.7"/>
  <ellipse cx="160" cy="190" rx="18" ry="10" fill="#2196f3" opacity="0.7"/>
  <ellipse cx="195" cy="180" rx="15" ry="8" fill="#ffffff" opacity="0.9"/>
  <!-- Small wrappers -->
  <rect x="150" y="183" width="12" height="8" rx="2" fill="#ffeb3b" opacity="0.9"/>
  <rect x="220" y="185" width="10" height="6" rx="2" fill="#4caf50" opacity="0.8"/>
  <!-- Label -->
  <rect x="10" y="10" width="200" height="36" rx="6" fill="#fff" opacity="0.85"/>
  <text x="20" y="32" font-family="system-ui,sans-serif" font-size="14" fill="#388e3c" font-weight="600">🗑 Sample: Roadside Plastic Bags</text>
</svg>
