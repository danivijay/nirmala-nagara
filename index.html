<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nirmala Nagara — Clean Bengaluru. Smarter Action. Report roadside garbage instantly." />
    <title>Nirmala Nagara — Clean Bengaluru</title>
    <script>
      // Handle GitHub Pages SPA redirect
      // 404.html sends /nirmala-nagara/dashboard to /nirmala-nagara/?p=/dashboard
      (function() {
        var params = new URLSearchParams(location.search);
        var p = params.get('p');
        if (p) {
          var q = params.get('q');
          history.replaceState(null, '', '/nirmala-nagara' + p + (q ? '?' + q : '') + location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
